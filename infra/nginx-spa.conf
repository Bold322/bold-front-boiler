server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ES module assets (.mjs) need a JS MIME; nginx's bundled mime.types has no
  # .mjs entry, so set it explicitly or browsers refuse to load them as modules.
  location ~ \.mjs$ {
    default_type text/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Hashed assets (Vite emits cache-busted filenames under /assets/).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback for TanStack Router deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached; otherwise a stale shell loads new assets.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
}
